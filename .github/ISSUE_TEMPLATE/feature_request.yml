name: Feature request
description: Explain a concrete file-management problem and a proposed improvement.
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the task you cannot complete comfortably today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
