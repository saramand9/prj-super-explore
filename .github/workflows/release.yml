name: Draft Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Validate release source and version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/master
          if ($LASTEXITCODE -ne 0) { throw 'Release source must be merged into master' }
          node scripts/verify-release.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:commit-policy
      - run: pnpm test:release
      - run: pnpm check:commits
      - run: pnpm test:unit
      - run: pnpm test:e2e
      - run: pnpm test:package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: pnpm pack:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Validate installation, upgrade and uninstall on the disposable runner
        run: pnpm --filter @explore/desktop test:installer
      - name: Generate installer checksums
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath apps/desktop/dist-electron -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          $hash = (Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installers[0].Name)" | Set-Content -LiteralPath apps/desktop/dist-electron/SHA256SUMS.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/SHA256SUMS.txt
            LICENSE
            THIRD_PARTY_NOTICES.md
            CHANGELOG.md

  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release
          path: release-assets
      - name: Create a draft, never publish automatically
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --draft --title "Explore $RELEASE_TAG" --generate-notes --notes "Unsigned Windows x64 build. Validate installation, upgrade, uninstall, asset rights and bundled license notices before publishing."
