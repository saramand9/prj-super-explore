name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:search
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:e2e
      - run: pnpm test:package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
