name: Windows checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:search
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:commit-policy
      - run: pnpm test:release
      - run: pnpm test:unit
      - run: pnpm test:e2e
      - run: pnpm test:package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: pnpm pack:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Validate installation, upgrade and uninstall on the disposable runner
        run: pnpm --filter @explore/desktop test:installer
