name: Windows checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:search
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:commit-policy
      - run: pnpm test:release
      - run: pnpm test:unit
      - run: pnpm test:e2e
      - run: pnpm test:package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: pnpm pack:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Validate installation, upgrade and uninstall on the disposable runner
        run: pnpm --filter @explore/desktop test:installer
